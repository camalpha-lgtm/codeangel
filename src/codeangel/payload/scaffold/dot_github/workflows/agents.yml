name: agents

on:
  pull_request:
  push:
    branches: [{{base_branch}}]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Claude skill shims in sync with .codeangel/skills
        run: python .codeangel/sync-shims.py --check
