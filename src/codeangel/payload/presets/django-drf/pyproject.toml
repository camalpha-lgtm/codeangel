[tool.poetry]
name = "{{project_package}}"
version = "0.1.0"
description = ""
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.1"
djangorestframework = "^3.18"
drf-spectacular = "^0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-django = "^4.14"
ruff = "^0.17.1"
prek = "^0.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
