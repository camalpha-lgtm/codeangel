name: {{area_name}}

on:
  pull_request:
    paths: ["{{area}}/**", ".github/workflows/{{area_name}}.yml"]
  push:
    branches: [{{base_branch}}]
    paths: ["{{area}}/**", ".github/workflows/{{area_name}}.yml"]

concurrency:
  group: {{area_name}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {{area}}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: {{area}}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint
