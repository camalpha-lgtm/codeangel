# build-loop state machine (codeangel, managed) — AUTHORITATIVE: stages, exit statuses, transitions, checks, artefacts.
# Each stage's `owner` skill (.codeangel/skills/<owner>/SKILL.md) = HOW to do it. scripts/transition.py enforces THIS file:
#   <runtime.python> .codeangel/skills/build-loop/scripts/transition.py status|go|log|docs|init|show …  (runtime.python: .codeangel/codeangel.toml)
# Never hand-edit spec frontmatter stage / last_status / attempt / mode / blocked_stage / blocked_reason / updated.
#
# Summary (detail below):
#   PLAN               planned[mode=plan] → AWAITING_APPROVAL · planned[mode=immediate] → IMPLEMENT
#   AWAITING_APPROVAL  approved → IMPLEMENT (mode := immediate) · revise → PLAN
#   IMPLEMENT          implemented → VERIFY
#   VERIFY             pass → REVIEW · fail → IMPLEMENT (+1 attempt)
#   REVIEW             waiting_ci ↺ · ci_flaky ↺ (once per REVIEW entry) · ci_green → LEARN
#                      ci_red_baseline → LEARN · ci_red_code → IMPLEMENT (+1 attempt)
#   LEARN              learned → DONE
#   BLOCKED            unblocked → <blocked_stage>
#   any non-terminal   blocked → BLOCKED · cancelled → CANCELLED
#   +1 attempt reaching max_attempts → forced BLOCKED (blocked_stage = the intended target)

version = 1
max_attempts = 5
terminal = ["DONE", "CANCELLED"]
plan_sections = [
  "Ticket",
  "Acceptance criteria",
  "Out of scope",
  "Affected files",
  "Test plan",
  "Docs impact",
  "Risks / open questions",
  "Baseline",
]

[[global_exits]]
status = "blocked"
to = "BLOCKED"
checks = ["note_required"]
effects = ["set_blocked"]
when = "A stop condition from build-loop references/contract.md. --note = the exact blocker + what the user must do."

[[global_exits]]
status = "cancelled"
to = "CANCELLED"
checks = ["note_required"]
when = "The user abandons the ticket. --note = why."

# ── stages ────────────────────────────────────────────────────────────────────

[stages.PLAN]
does = "Baseline the untouched branch, research, write the spec. No code changes."
owner = "build-plan"
entry = [
  "STARTUP done: cleanup ran, workspace aligned to the Linear branch, env healthy",
  "spec created by `init`, or re-entered via revise / unblocked",
]
produces = [
  "docs/specs/<TICKET>.md (created by `init`)",
  "§Ticket: verbatim ticket text",
  "§Acceptance criteria: '- [ ] AC-n: …' lines, observable + testable, written as user behaviour, each tagged '[proof: api|ui|cli|none — reason]'",
  "§Out of scope: ≥ 1 bullet",
  "§Affected files: table path | create|modify | why",
  "§Test plan: table test-id (<file>::<name>, relative to its area) | AC ids | asserts",
  "§Docs impact: table doc | updated / unchanged | note — every doc `T docs` maps from the planned Affected files (docs/ai/doc-map.toml), plus any other doc the change makes stale; or '- none: <why>'",
  "§Risks / open questions: '[blocking]' / '[non-blocking]' items, or '- none'",
  "§Baseline: base_sha, each touched area's gate results, known failures, lint debt, schema drift",
  "after the exit: local commit '<TICKET>: Plan' (spec only)",
]

[[stages.PLAN.exits]]
status = "planned"
mode = "plan"
to = "AWAITING_APPROVAL"
checks = ["plan_complete", "ac_test_mapping", "ac_proof_planned", "no_blocking_risks"]
when = "Spec complete, mode=plan → commit spec, present the plan summary, end the turn."

[[stages.PLAN.exits]]
status = "planned"
mode = "immediate"
to = "IMPLEMENT"
checks = ["plan_complete", "ac_test_mapping", "ac_proof_planned", "no_blocking_risks"]
when = "Spec complete, mode=immediate → commit spec, continue without pausing."

[stages.AWAITING_APPROVAL]
does = "Plan presented, turn ended; waiting for the user."
owner = "build-loop"
entry = ["plan summary shown: AC, out of scope, affected files, tests, risks"]
produces = ["nothing until the user replies"]

[[stages.AWAITING_APPROVAL.exits]]
status = "approved"
to = "IMPLEMENT"
effects = ["set_mode_immediate"]
when = "User approves (`/build-loop <ID>` / `immediate` / 'approve', 'go', 'resume'). Apply feedback to the spec + §Plan amendments BEFORE this exit."

[[stages.AWAITING_APPROVAL.exits]]
status = "revise"
to = "PLAN"
checks = ["note_required"]
when = "Feedback needs re-planning (`plan` + feedback). --note = the feedback. Mode stays plan → PLAN ends in AWAITING_APPROVAL again."

[stages.IMPLEMENT]
does = "Planned tests first (seen failing for the right reason), then code; stay inside §Affected files."
owner = "build-implement"
entry = [
  "from approved / planned: §Test plan + §Affected files are the work list",
  "from fail / ci_red_code: read the latest §Verify reports attempt or §Review CI failure FIRST",
]
produces = [
  "uncommitted code + test changes limited to §Affected files",
  "schema migrations generated with the area's command when models change (never hand-written)",
  "§Plan amendments line per scope adjustment",
  "docs updated in the same change: every §Docs impact row marked updated; new rows for docs the real diff maps to (`T docs`)",
  "changed files clean under each touched area's lint / format gate before the exit",
]

[[stages.IMPLEMENT.exits]]
status = "implemented"
to = "VERIFY"
checks = ["planned_tests_exist"]
when = "Every planned test exists and passes in a targeted run; changed files are lint-clean."

[stages.VERIFY]
does = "Run V1–V9 against §Baseline; exercise each AC as a user would and record the proof in §Evidence."
owner = "build-verify"
entry = ["implementation in the working tree (uncommitted)", "run by an independent verifier (subagent where supported): edits only the spec, never code, never commits"]
produces = [
  "§Verify reports: '### Attempt <attempt+1> — PASS|FAIL' + one line per V1–V9; per FAIL ≤ 20-line excerpt, root cause, next action",
  "on PASS: every AC ticked '- [x]', evidence 'AC-n: <test node id>; <file>:<line>' in the report",
  "§Evidence: one row per AC (kind, artefact paths under <spec_dir>/evidence/<TICKET>/ or 'not captured: <reason>', note); the artefact files themselves, git-ignored (T evidence) and never committed",
]

[[stages.VERIFY.exits]]
status = "pass"
to = "REVIEW"
checks = ["latest_attempt_pass", "all_ac_ticked", "docs_synced", "evidence_recorded"]
when = "All V1–V9 pass. (The commit happens at REVIEW step 1.)"

[[stages.VERIFY.exits]]
status = "fail"
to = "IMPLEMENT"
checks = ["latest_attempt_fail", "note_required"]
effects = ["increment_attempt"]
when = "Any V check fails. --note = failing V ids + one-line root cause."

[stages.REVIEW]
does = "Push, open / update the draft PR, wait for CI, mark ready when green."
owner = "build-review"
entry = [
  "latest attempt PASS",
  "GitHub access ok: the GitHub MCP is available, or `gh auth status` passes",
  "current branch == frontmatter branch",
]
produces = [
  "commit '<TICKET>: <summary>' of the verified work (affected files + spec) — step 1, when the tree is dirty",
  "pushed branch",
  "draft PR → frontmatter pr = URL (T3: linked to the thread)",
  "§Review: PR, 'CI runs' lines '<run id> <sha> <conclusion>', ready status",
  "ci_green: PR marked ready BEFORE the exit",
]

[[stages.REVIEW.exits]]
status = "waiting_ci"
to = "REVIEW"
checks = ["pr_recorded"]
when = "Pushed; CI running. T3 watch_pull_request → take this exit, end turn."

[[stages.REVIEW.exits]]
status = "ci_flaky"
to = "REVIEW"
checks = ["pr_recorded", "note_required", "ci_flaky_once"]
when = "Infra / flaky failure that passes locally → rerun the failed jobs. Once per REVIEW entry; a second = ci_red_code."

[[stages.REVIEW.exits]]
status = "ci_green"
to = "LEARN"
checks = ["pr_recorded"]
when = "All checks green on the pushed head AND the PR is marked ready."

[[stages.REVIEW.exits]]
status = "ci_red_baseline"
to = "LEARN"
checks = ["pr_recorded", "note_required"]
when = "Only §Baseline known failures fail; PR stays draft. --note = failing checks."

[[stages.REVIEW.exits]]
status = "ci_red_code"
to = "IMPLEMENT"
checks = ["pr_recorded", "note_required"]
effects = ["increment_attempt"]
when = "Code / env failure in CI. --note = failing job + root cause. Loop forward: IMPLEMENT → VERIFY → REVIEW (commit + push to the same PR)."

[stages.LEARN]
does = "Turn this ticket's surprises into durable learnings; final report."
owner = "build-learn"
entry = ["PR exists (ready, or draft after ci_red_baseline)"]
produces = [
  "learnings in the right area (docs/learnings/ or <area>/docs/learnings/): additions / updates / deletions, or none + reason",
  "docs/ai fixes + promotions, index / router rows for new files (per docs/ai/agent-docs.md)",
  "docs/ai/doc-map.toml rule added / widened for every doc that went stale without a rule catching it",
  "§Learnings: '<file>: <change>' per edit, or 'none: <why>'",
  "after the exit: commit '<TICKET>: Record learnings' pushed to the PR (the build-loop coordinator writes the final report)",
]

[[stages.LEARN.exits]]
status = "learned"
to = "DONE"
checks = ["learnings_recorded"]
when = "Learnings written and §Learnings filled."

[stages.BLOCKED]
does = "Stopped; waiting for the user to resolve blocked_reason."
owner = "build-loop"
entry = ["blocked_stage + blocked_reason set (blocked exit or attempt cap)", "user told exactly what is needed"]
produces = ["nothing"]

[[stages.BLOCKED.exits]]
status = "unblocked"
to = "@blocked_stage"
checks = ["note_required"]
effects = ["clear_blocked"]
when = "User resolved the blocker. --note = the resolution."

[stages.DONE]
does = "Terminal. PR open (ready, or draft after ci_red_baseline); learnings pushed."
owner = "build-loop"
produces = []

[stages.CANCELLED]
does = "Terminal. User abandoned the ticket; branch / PR left as they are."
owner = "build-loop"
produces = []

# ── check + effect definitions (transition.py implements exactly these) ──────

[checks]
plan_complete = "Each plan_sections section exists, has ≥ 1 non-template line, and keeps no template placeholder line."
ac_test_mapping = "Every AC-n in §Acceptance criteria is covered by ≥ 1 §Test plan row; every row covers ≥ 1 known AC."
ac_proof_planned = "Every AC line carries a '[proof: api|ui|cli|none — reason]' tag (kinds may combine with '+'); 'none' needs a reason."
no_blocking_risks = "No '[blocking]' item in §Risks / open questions."
planned_tests_exist = "Every §Test plan id resolves: <file> exists under an area path (or the repo root) and contains each named class / test."
latest_attempt_pass = "Last '### Attempt N — …' in §Verify reports has N = attempt + 1 and says PASS."
latest_attempt_fail = "Last '### Attempt N — …' in §Verify reports has N = attempt + 1 and says FAIL."
all_ac_ticked = "Every AC line is '- [x]'."
pr_recorded = "Frontmatter pr is a URL."
learnings_recorded = "§Learnings has ≥ 1 non-template line."
note_required = "--note given."
ci_flaky_once = "No ci_flaky since the last entry into REVIEW from another stage."
evidence_recorded = "§Evidence has one row per AC; each row's kind is api, ui, cli or none; its proof is existing non-empty files under <spec_dir>/evidence/<TICKET>/ including at least one text file, 'not captured: <reason>', or (kind none, planned none) 'n/a: <reason>'; a planned api/ui/cli AC is never kind none; no credential-looking value in the section or in a text artefact; the evidence directory is git-ignored and no file in it is tracked."
docs_synced = "Every doc docs/ai/doc-map.toml maps from the files changed since base_sha has a §Docs impact row; updated rows really changed, unchanged rows give a reason; changed docs have clean whitespace; Claude shims in sync when skills changed."

[effects]
increment_attempt = "attempt += 1; reaching max_attempts redirects to BLOCKED (blocked_stage = intended target)."
set_blocked = "blocked_stage := current stage; blocked_reason := --note."
clear_blocked = "Go to blocked_stage; clear blocked_*; attempt := 0 if the block was the attempt cap."
set_mode_immediate = "mode := immediate."
