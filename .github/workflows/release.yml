name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Labels of the merged pull request
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[].labels[].name] | join(",")')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Bump the version, commit and tag
        id: bump
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python .github/scripts/bump_version.py --release --labels "$LABELS")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push the release commit and tag
        run: git push origin main "v${{ steps.bump.outputs.version }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --verify-tag --generate-notes --title "codeangel ${{ steps.bump.outputs.version }}"
