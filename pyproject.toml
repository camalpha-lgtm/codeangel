[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeangel"
version = "0.1.0"
description = "Agent-agnostic AI software factory: skills, an enforced build loop, and self-maintaining agent docs for any repo."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cameron Hobbs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codeangel = "codeangel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeangel = ["payload/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/codeangel/payload/presets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
